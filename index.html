    <style>
      :root { --ink:#172033; --muted:#667085; --paper:#fff; --line:#e4e7ec; --blue:#2563eb; --orange:#ea580c; }
      html, body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .route-marker { width:34px; height:34px; border:3px solid #fff; border-radius:50% 50% 50% 8px; transform:rotate(-45deg); box-shadow:0 4px 12px rgba(15,23,42,.25); display:grid; place-items:center; color:#fff; }
      .route-marker span { transform:rotate(45deg); font-weight:800; font-size:14px; }
      .route-div-icon { background:transparent; border:0; }
      .trip-panel { position:fixed; z-index:9998; top:18px; left:18px; width:330px; max-height:calc(100vh - 36px); overflow:auto; box-sizing:border-box; background:rgba(255,255,255,.96); color:var(--ink); border:1px solid rgba(15,23,42,.10); border-radius:18px; box-shadow:0 18px 48px rgba(15,23,42,.22); backdrop-filter:blur(12px); }
      .trip-head { position:sticky; top:0; z-index:2; padding:18px 18px 15px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); border-radius:18px 18px 0 0; }
      .trip-kicker { color:var(--orange); font-size:12px; font-weight:800; letter-spacing:.08em; }
      .trip-head h1 { margin:5px 0 4px; font-size:20px; line-height:1.25; }
      .trip-head p { margin:0; color:var(--muted); font-size:13px; }
      .panel-toggle { position:absolute; top:14px; right:14px; width:34px; height:34px; border:0; border-radius:10px; background:#f2f4f7; color:var(--ink); cursor:pointer; font-size:18px; }
      .timeline { padding:14px 14px 16px; }
      .timeline-stop { width:100%; display:grid; grid-template-columns:34px 1fr; gap:11px; align-items:start; border:0; border-radius:12px; padding:9px; background:transparent; color:inherit; text-align:left; cursor:pointer; }
      .timeline-stop:hover, .timeline-stop:focus-visible { background:#f2f4f7; outline:none; }
      .timeline-number { width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:var(--orange); color:#fff; font-size:13px; font-weight:800; }
      .timeline-stop:first-of-type .timeline-number { background:var(--blue); }
      .timeline-copy { display:grid; grid-template-columns:47px 1fr; column-gap:8px; align-items:baseline; }
      .timeline-time { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
      .timeline-copy strong { font-size:14px; }
      .timeline-copy small { grid-column:2; margin-top:3px; color:var(--muted); font-size:12px; }
      .timeline-gap { margin:0 0 0 24px; padding:2px 0 2px 32px; border-left:2px solid var(--line); color:#98a2b3; font-size:11px; }
      .trip-note { margin:0; padding:11px 18px 15px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
      .trip-panel.is-collapsed { width:54px; height:54px; overflow:hidden; border-radius:15px; }
      .trip-panel.is-collapsed .trip-head { height:54px; padding:0; border:0; }
      .trip-panel.is-collapsed .trip-head > :not(.panel-toggle), .trip-panel.is-collapsed .timeline, .trip-panel.is-collapsed .trip-note { display:none; }
      .trip-panel.is-collapsed .panel-toggle { top:10px; right:10px; }
      .route-popup { min-width:240px; color:var(--ink); font-family:inherit; }
      .popup-seq { color:var(--orange); font-size:11px; font-weight:800; letter-spacing:.08em; }
      .popup-time { margin-top:5px; color:var(--muted); font-size:13px; font-weight:700; }
      .route-popup h3 { margin:2px 0 8px; font-size:18px; }
      .route-popup p { margin:5px 0; line-height:1.45; }
      .popup-activity { font-weight:700; }
      .popup-address { color:var(--muted); font-size:12px; }
      .route-popup a { display:inline-block; margin-top:7px; color:var(--blue); font-weight:700; text-decoration:none; }
      @media (max-width: 640px) {
        .trip-panel { top:10px; left:10px; right:10px; width:auto; max-height:46vh; }
        .trip-panel.is-collapsed { right:auto; width:54px; }
        .leaflet-control-zoom { margin-top:74px !important; }
      }
